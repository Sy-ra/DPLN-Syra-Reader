<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Zoom</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; cursor: zoom-out; user-select: none; }
  img {
    display: block; width: 100%; height: 100%; object-fit: contain; box-sizing: border-box;
    border-radius: 10px; border: 1px solid #3c4350; background: #121419;
    opacity: 0; transform: scale(.9); transition: opacity .14s, transform .14s ease-out;
  }
  img.on { opacity: 1; transform: none; }
</style>
</head>
<body>
<img id="img" alt="" draggable="false">
<script src="zoom.js"></script>
</body>
</html>
